<body>
    <form action="" method="POST">
{% csrf_token %}
        Name: <input type="text" name="name" >
        <span style="color:red;">{{ name_error}}</span>
        <br>
        Email: <input type="text" name="email" >
        <span style="color:red;">{{ email_error }}</span>
        <br>
        Password: <input type="text" name="password" >
        <span style="color:red;">{{ password_error }}</span>
        <br>
        <input type="submit" value="Submit">

    </form>

    {% if submitted_details %}
        <h2>Submitted Details:</h2>
        <p>Name: {{ submitted_details.name }}</p>
        <p>Email: {{ submitted_details.email }}</p>
        <p>Password: {{ submitted_details.password}}</p>
    {% endif %}
</body>
